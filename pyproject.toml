[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adm-player"
version = "0.1.0"
description = "Play ADM BWF and stream object metadata via ADM-OSC"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "cffi>=1.15",
  "soundfile>=0.12",
  "sounddevice>=0.4",
  "python-osc>=1.8",
]

[project.scripts]
adm-player = "adm_player.__main__:main"
adm-player-gui = "adm_player.gui_app:main"
adm-recorder-gui = "adm_recorder.gui_app:main"

[project.optional-dependencies]
gui = ["PySide6>=6.5.0", "psutil>=5.9.0"]
packaging = ["pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["adm_player*", "adm_recorder*"]

[tool.setuptools.package-data]
adm_player = ["resources/LOGO_White.png"]
