name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + test tools
        # soundfile / sounddevice ship their native libs (libsndfile, PortAudio)
        # inside the wheels, so no apt step is needed. The test suite is headless:
        # it imports neither sounddevice nor PySide6.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff

      - name: Lint (critical errors only)
        # Syntax errors + undefined names. This subset has effectively zero
        # false positives, so it gates real breakage without enforcing style.
        run: ruff check --select=E9,F63,F7,F82 adm_player adm_recorder

      - name: Run tests
        run: pytest tests/ -q
